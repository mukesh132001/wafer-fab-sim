# Default fab: 10 tool groups, 33-step re-entrant route, lot-based (25 wafers/lot).
# All times are in HOURS. Loaded with Python's built-in tomllib (no extra install).

fab_name = "mini-fab-v1"
wafers_per_lot = 25
process_time_cv = 0.30          # coefficient of variation of processing times (gamma dist.)
due_date_flow_factor = 2.5      # due date = release + FF x raw process time

# Optional fields: batch_max, batch_min, max_batch_wait (h), scrap_rate (per wafer per step)
tool_groups = [
  { name = "CLEAN",   tools = 3, mtbf = 200, mttr = 3 },
  { name = "DIFF",    tools = 4, mtbf = 150, mttr = 6, batch_max = 6, batch_min = 3, max_batch_wait = 3.0 },
  { name = "LITHO",   tools = 3, mtbf = 80,  mttr = 6 },
  { name = "ETCH",    tools = 4, mtbf = 100, mttr = 6, scrap_rate = 0.001 },
  { name = "IMPLANT", tools = 2, mtbf = 160, mttr = 5 },
  { name = "DEPO",    tools = 3, mtbf = 140, mttr = 5 },
  { name = "CMP",     tools = 3, mtbf = 90,  mttr = 3, scrap_rate = 0.002 },
  { name = "PVD",     tools = 3, mtbf = 150, mttr = 4 },
  { name = "METRO",   tools = 2, mtbf = 300, mttr = 2 },
  { name = "PROBE",   tools = 2, mtbf = 250, mttr = 3, scrap_rate = 0.01 },
]

# Re-entrant: LITHO is visited 6x, ETCH 6x, METRO 5x ...
route = [
  { module = "feol",         repeat = 1 },
  { module = "device_layer", repeat = 2 },
  { module = "metal_layer",  repeat = 3 },
  { module = "final",        repeat = 1 },
]

[release]
policy = "constant"             # constant | poisson.  Week 2: conwip / dbr
interarrival_hours = 2.4        # one lot every 2.4 h -> 10 lots/day -> 250 wafer starts/day


# Route modules. Each step: [tool_group, process_hours, recipe]
# process_hours is per lot, or per BATCH for batch tools (DIFF).
[modules]
feol = [
  ["CLEAN",   0.9,  "PRECLEAN"],
  ["DIFF",    7.0,  "OXIDATION"],
  ["LITHO",   1.02, "L_WELL"],
  ["ETCH",    1.25, "E_STI"],
  ["IMPLANT", 1.3,  "I_WELL"],
  ["CLEAN",   0.9,  "POSTCLEAN"],
  ["DIFF",    6.0,  "ANNEAL"],
]
device_layer = [
  ["DEPO",    1.4,  "D_FILM"],
  ["LITHO",   1.02, "L_LAYER"],
  ["ETCH",    1.25, "E_LAYER"],
  ["CLEAN",   0.9,  "POSTCLEAN"],
  ["METRO",   0.6,  "M_CD"],
]
metal_layer = [
  ["PVD",     1.3,  "P_METAL"],
  ["LITHO",   1.02, "L_METAL"],
  ["ETCH",    1.25, "E_METAL"],
  ["CMP",     1.3,  "C_METAL"],
  ["METRO",   0.6,  "M_THICK"],
]
final = [
  ["PROBE",   2.5,  "WAFER_SORT"],
]
