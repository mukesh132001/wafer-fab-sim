name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fab
          POSTGRES_PASSWORD: fab
          POSTGRES_DB: fab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fab" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt scipy matplotlib
      - name: Unit, validation and agent tests (real SimPy; stats checked against SciPy)
        run: pytest -q
      - name: Simulation run logged to PostgreSQL
        run: |
          python -m fabsim.run --db postgresql://fab:fab@localhost:5432/fab --days 120
          python -m fabsim.run --db postgresql://fab:fab@localhost:5432/fab --days 120 --rule CR
      - name: Query metric views
        env:
          PGPASSWORD: fab
        run: |
          psql -h localhost -U fab -d fab -c "SELECT tool_group, ROUND(avg_queue_h::numeric,2) AS avg_queue_h FROM v_queue_time_by_group ORDER BY 2 DESC LIMIT 5"
          psql -h localhost -U fab -d fab -c "SELECT run_id, week, ROUND(mean_ct_h::numeric,1) AS ct FROM v_weekly_cycle_time ORDER BY 1, 2 LIMIT 5"
      - name: API smoke test against PostgreSQL
        run: |
          python -m fabsim.api --db postgresql://fab:fab@localhost:5432/fab --port 8000 &
          sleep 3
          curl -sf localhost:8000/api/runs | head -c 400; echo
          curl -sf localhost:8000/ | head -c 100; echo
      - name: Quick experiment + case study (smoke)
        run: |
          python -m fabsim.experiment --reps 3 --days 90 --out /tmp/exp
          python -m fabsim.casestudy --reps 2 --out /tmp/case
